<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberLab - Password Checker</title>
<style>
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;margin:0}
.box{background:#161616;padding:25px;border-radius:15px;width:320px;border:1px solid #00ff41;box-shadow:0 0 20px #00ff4133}
h2{color:#00ff41;text-align:center}
.input-box{display:flex;background:#000;border:1px solid #333;border-radius:8px;padding:5px}
input{flex:1;background:transparent;border:0;color:white;padding:10px;outline:none;font-size:16px}
#eye{padding:10px;cursor:pointer;color:white}
.strength{height:6px;background:#333;margin-top:15px;border-radius:10px;overflow:hidden}
#bar{height:100%;width:0%;transition:0.4s}
#message{color:#777;margin-top:10px;text-align:center;font-size:14px}
</style>
</head>
<body>
<div class="box">
<h2>Create password</h2>
<div class="input-box">
<input type="password" id="password" placeholder="Enter password">
<span id="eye">👁️</span>
</div>
<div class="strength"><div id="bar"></div></div>
<div id="message">Start typing...</div>
</div>
<script>
let pass=document.getElementById("password");
let bar=document.getElementById("bar");
let msg=document.getElementById("message");
let eye=document.getElementById("eye");
pass.addEventListener('input',()=>{
let v=pass.value;
let s=0;
if(v.length>5)s++;
if(/[A-Z]/.test(v))s++;
if(/[0-9]/.test(v))s++;
if(/[^A-Za-z0-9]/.test(v))s++;
if(s==1){bar.style.width="25%";bar.style.background="red";msg.innerText="Weak 😢";}
else if(s==2){bar.style.width="50%";bar.style.background="orange";msg.innerText="Medium 🙂";}
else if(s>=3){bar.style.width="100%";bar.style.background="#00ff41";msg.innerText="Strong 💪 CYBERLAB SECURE";}
else{bar.style.width="0%";msg.innerText="Start typing...";}
});
eye.onclick=()=>{pass.type=pass.type=="password"?"text":"password";}
</script>
</body>
</html>
